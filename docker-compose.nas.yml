services:
  japan-life:
    image: isoards/japan-life:latest
    container_name: japan-life
    user: "0:0"
    ports:
      - "3090:3000"
    volumes:
      - /volume1/docker/japan-life/data:/app/data/user
    environment:
      - DATA_DIR=/app/data/user
      - GOOGLE_SHEETS_API_KEY=${GOOGLE_SHEETS_API_KEY}
      - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID:-}
      - GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL:-}
      - GOOGLE_SHEETS_PRIVATE_KEY=${GOOGLE_SHEETS_PRIVATE_KEY:-}
      - GOOGLE_SHEETS_WRITE_PROVIDER=${GOOGLE_SHEETS_WRITE_PROVIDER:-service-account}
      - GOOGLE_SHEETS_APPS_SCRIPT_URL=${GOOGLE_SHEETS_APPS_SCRIPT_URL:-}
      - GOOGLE_SHEETS_APPS_SCRIPT_SECRET=${GOOGLE_SHEETS_APPS_SCRIPT_SECRET:-}
      - RECEIPT_OCR_PROVIDER=${RECEIPT_OCR_PROVIDER:-google-cloud-vision}
      - GOOGLE_CLOUD_VISION_API_KEY=${GOOGLE_CLOUD_VISION_API_KEY:-}
      - GOOGLE_CLOUD_TRANSLATION_API_KEY=${GOOGLE_CLOUD_TRANSLATION_API_KEY:-}
      - PANTRY_MCP_BASE_URL=${PANTRY_MCP_BASE_URL:-}
      - PANTRY_MCP_AUTH_SECRET=${PANTRY_MCP_AUTH_SECRET:-}
      - PANTRY_MCP_PASSWORD=${PANTRY_MCP_PASSWORD:-}
      - PANTRY_MCP_ALLOWED_REDIRECT_ORIGINS=${PANTRY_MCP_ALLOWED_REDIRECT_ORIGINS:-https://chatgpt.com}
    restart: unless-stopped
